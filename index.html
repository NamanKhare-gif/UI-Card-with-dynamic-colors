<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Color Card Design</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Playfair:ital,opsz,wght@0,5..1200,300..900;1,5..1200,300..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>

    <section class="Card-main">
        <div class="Main-content">
            <div class="Card">
                <div class="Top-section"></div>
                <div class="Bottom-section">
                    <div class="img-section">
                        <div class="profile-section">
                            <div class="profile-img"></div>
                        </div>
                    </div>
                    <div class="heading">
                        <h2 id="main-heading">Naman Khare</h2>
                        <p id="sub-heading">Software Developer Enginner</p>
                    </div>
                    <div class="follower-count">
                        <div class="follower">
                            <span>1.6K</span>
                            <p class="tert-text" id="follower-text">Followers</p>
                        </div>
                        <div class="following">
                            <span>852</span>
                            <p class="tert-text" id="following-text">Following</p>
                        </div>
                    </div>
                    <div class="Follower-btn">
                        <button class="Primary-btn">Follow</button>
                        <button class="Secondary-btn">Message</button>
                    </div>
                </div>
            </div>
            <div class="Dynamic-colors-btns">
                <div class="btns-list">
                    <button class="dynamic-btn" id="pink" style="background-color: var(--Primary-color);"></button>
                    <button class="dynamic-btn" id="blue" style="background-color: var(--Secnondary-color);"></button>
                    <button class="dynamic-btn" id="purple" style=" background-color: var(--Tertiary-color);"></button>
                    <button class="dynamic-btn" id="green" style=" background-color: var(--Quaternary-color);"></button>
                    <button class="dynamic-btn" id="yellow" style="background-color: var(--Quinary-color);"></button>
                </div>
            </div>
        </div>
    </section>
    
</body>
<script src="script.js"></script>
</html>
